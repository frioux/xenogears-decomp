
name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        game_id: [ SLUS_006.64 ]
      fail-fast: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -U -r requirements.txt
          sudo apt-get update
          sudo apt-get install make binutils-mips-linux-gnu cpp-mips-linux-gnu

      - name: Setup build environment
        run: |
          curl -L -o disc/SLUS_006.64 "${{ secrets.FILE_URL }}"
          curl -L -o disc/movie.bin "${{ secrets.FILE_URL_2 }}"
          curl -L -o disc/field.bin "${{ secrets.FILE_URL_3 }}"
          curl -L -o disc/member_change_menu.bin "${{ secrets.FILE_URL_4 }}"
          curl -L -o disc/shop_menu.bin "${{ secrets.FILE_URL_5 }}"
          curl -L -o disc/gear_shop_menu.bin "${{ secrets.OVL_GEAR_SHOP_URL }}"
          curl -L -o disc/lib_gear.bin "${{ secrets.OVL_GEAR_SHOP_HELPER_URL }}"
      
      - name: Build
        run: |
          make build

      - name: Check match
        run: make check

      - name: Generate Progress Report
        run: make report

      - name: Publish progress site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
          tools/progress/publish.sh build/progress.json

      - name: Upload Progress Report
        uses: actions/upload-artifact@v4
        with:
            name: ${{ matrix.game_id }}_report
            path: ./build/progress.json
