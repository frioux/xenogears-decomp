name: Build

# Build + checksum check in CI. Needs the game binaries, which are not in the
# repo: set the FILE_URL* / OVL_* secrets to download them, otherwise the
# build steps are skipped (the progress site is published by progress.yaml,
# which needs no binaries).
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        game_id: [ SLUS_006.64 ]
      fail-fast: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        if: ${{ secrets.FILE_URL != '' }}
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install dependencies
        if: ${{ secrets.FILE_URL != '' }}
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -U -r requirements.txt
          sudo apt-get update
          sudo apt-get install make binutils-mips-linux-gnu cpp-mips-linux-gnu

      - name: Setup build environment
        if: ${{ secrets.FILE_URL != '' }}
        run: |
          mkdir -p disc
          curl -L -o disc/SLUS_006.64 "${{ secrets.FILE_URL }}"
          curl -L -o disc/movie.bin "${{ secrets.FILE_URL_2 }}"
          curl -L -o disc/field.bin "${{ secrets.FILE_URL_3 }}"
          curl -L -o disc/member_change_menu.bin "${{ secrets.FILE_URL_4 }}"
          curl -L -o disc/shop_menu.bin "${{ secrets.FILE_URL_5 }}"
          curl -L -o disc/gear_shop_menu.bin "${{ secrets.OVL_GEAR_SHOP_URL }}"
          curl -L -o disc/lib_gear.bin "${{ secrets.OVL_GEAR_SHOP_HELPER_URL }}"

      - name: Build
        if: ${{ secrets.FILE_URL != '' }}
        run: make build

      - name: Check match
        if: ${{ secrets.FILE_URL != '' }}
        run: make check

      - name: Generate Progress Report
        if: ${{ secrets.FILE_URL != '' }}
        run: make report

      - name: Upload Progress Report
        if: ${{ secrets.FILE_URL != '' }}
        uses: actions/upload-artifact@v4
        with:
            name: ${{ matrix.game_id }}_report
            path: ./build/progress.json
