name: Battle Overlay
sha1: 124703d415f570f9cd8d7dad89c6a4eddfd7e6f0
options:
  basename: battle.bin
  target_path: disc/battle.bin
  base_path: ../
  platform: psx
  compiler: PSYQ

  asm_path: asm/battle
  src_path: src/battle
  build_path: build/

  ld_script_path: linker/battle.ld

  find_file_boundaries: False
  gp_value: 0x80059170
  global_vram_start: 0x80010000

  o_as_suffix: False
  use_legacy_include_asm: False

  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel

  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_addrs_path:
    - config/symbol_addrs.battle.txt
    - config/symbol_addrs.slus_006.64.txt
  reloc_addrs_path:
    - config/reloc_addrs.txt

  undefined_funcs_auto_path: linker/undefined_funcs_auto.battle.txt
  undefined_syms_auto_path: linker/undefined_syms_auto.battle.txt

  extensions_path: tools/splat_ext

  subalign: 4

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  ld_bss_is_noload: true
segments:
  - name: battle
    type: code
    start: 0x0
    vram: 0x8006FAF0
    bss_size: 0x20000 # yolo
    align: 4
    subalign: 4
    subsegments:
      - [0x0, rodata]
      - [0x4, .rodata, main/misc2]
      - [0x18, rodata]
      - [0x48, .rodata, main/misc4]
      - [0x8C, .rodata, main/misc5]
      - [0x14C, .rodata, main/misc10]
      - [0x38C, .rodata, main/misc11]
      # The misc11 table block is 8 jump tables: func_80080160's 101-word table at
      # +0x0, then seven 8-word tables from +0x194 on, at 4-mod-8 offsets. cc1
      # emits `.align 3` (section-relative) before every jump table, so a switch
      # converted inside the head can never land where retail has it (+4 bytes and
      # the overlay grows). Starting the tail run's .rodata at 0x520 (abs
      # 0x80070010, 8-aligned) makes every one of its tables 8-aligned, so they
      # convert. See main/misc11_b.
      - [0x520, .rodata, main/misc11_b]
      # misc11_b's 7 tables are one 0x20-byte table per switch: the head's four
      # (Display, Activate, Exit, FourSlot) at +0x0, the tail's three (Queue,
      # SubMode, Random) at +0x80. The tail is its own TU (main/misc11_b_r2), so its
      # tables have to travel with it or the whole block shifts.
      - [0x5A0, .rodata, main/misc11_b_r2]
      - [0x600, .rodata, main/misc12]
      - [0x760, .rodata, main/misc13]
      - [0x824, .rodata, main/misc15]
      - [0x880, .rodata, main/misc17]
      # A 4-byte pad word closes retail's misc17 table block (a 5-case switch
      # plus 0); it belongs to asm so the switch in func_80094EE4 can be converted.
      - [0x894, rodata]
      - [0x898, .rodata, main/misc18]
      # misc19's two tables both belong to functions of main/misc19_b: jtbl_80070428
      # at +0x0 (BattleDecrementGearPartUse) and jtbl_80070478 at +0x50
      # (BattleSetCommandCodeForSlotKindFlag), so the range travels with that TU.
      - [0x938, .rodata, main/misc19_b]
      # jtbl_800704A0 belongs to func_8009BAC4, which sits in main/misc19_r1 (its run
      # of the unit is gcc 2.6.0; see gears.toml XenoLibrary), so the table's bytes
      # have to travel with that TU or the whole rodata block shifts.
      - [0x9B0, .rodata, main/misc19_r1]
      - [0x9DC, .rodata, main/misc20]
      - [0xA24, .rodata, main/misc21]
      - [0xA64, .rodata, main/misc23]
      # A 4-byte pad word closes retail's misc23 table block (a 5-case switch
      # plus 0); it belongs to asm so the switch itself can be converted.
      - [0xA78, rodata]
      - [0xA7C, .rodata, main/misc24]
      - [0xCAC, .rodata, main/misc25]
      - [0xCEC, .rodata, main/misc26]
      - [0xD60, .rodata, main/misc27]
      # misc29's two tables: func_800B7870's 5-word jtbl at +0x0 (still asm) and
      # func_800B8098's 6-word jtbl at +0x14, i.e. 4 mod 8, so cc1's `.align 3`
      # before a C jump table cannot land it there. The head table is carved out as
      # splat rodata so the unit's C .rodata starts 8-aligned at 0xF20.
      - [0xF0C, rodata]
      - [0xF20, .rodata, main/misc29]
      - [0xF38, .rodata, main/misc30]
      - [0xFEC, .rodata, main/misc32]
      - [0x1018, .rodata, main/misc34]
      - [0x1124, .rodata, main/misc35]
      - [0x133C, c, main/misc1]
      - [0x4074, c, main/misc2]
      - [0x6FD8, c, main/misc3]
      - [0x8D8C, c, main/misc4]
      - [0xA328, c, main/misc5]
      - [0xB0E8, c, main/misc5_r1]
      - [0xB140, c, main/misc6]
      - [0xB27C, c, main/misc6_r1]
      - [0xB348, c, main/misc6_r2]
      - [0xB934, c, main/misc7]
      - [0xC6B4, c, main/misc8]
      - [0xDDD0, c, main/misc9]
      - [0xE844, c, main/misc9_260]
      - [0xEF18, c, main/misc10]
      - [0x100F0, c, main/misc11]
      # Split at func_8008115C (the first of the table-owning tail functions); the
      # split point is the yaml rodata split above, 0x520.
      - [0x1166C, c, main/misc11_b]
      - [0x12068, c, main/misc11_b_r1]
      - [0x125B4, c, main/misc11_b_r2]
      - [0x12D30, c, main/misc12]
      - [0x15B28, c, main/misc13]
      - [0x18EA0, c, main/misc14]
      - [0x1AF84, c, main/misc15]
      - [0x1D2F4, c, main/misc16]
      - [0x1FF70, c, main/misc16_r1]
      - [0x1FFE8, c, main/misc16_r2]
      - [0x21574, c, main/misc17]
      - [0x25F88, c, main/misc18]
      - [0x2A5EC, c, main/misc19]
      # func_8009ADA0 (0x2B2B0..0x2B40C) is 100.00 only under gcc 2.6.0 - 2.7.2's own
      # expand_divmod gets all four `/20`,`/50` divisions wrong (88.68, 356 bytes vs
      # retail's 348) - so that one function is its own TU on the XenoLibrary preset
      # and the run after it stays on Default as main/misc19_b.
      - [0x2B2B0, c, main/misc19_r2]
      - [0x2B40C, c, main/misc19_b]
      # func_8009BAC4 on is byte-identical only under gcc 2.6.0 (try_flags.sh: every
      # already-matched function of the head stays 100 under Default, and eleven of
      # them drop under 2.6.0, so the unit is mixed and the tail is its own TU).
      - [0x2BFD4, c, main/misc19_r1]
      - [0x2C644, c, main/misc20]
      - [0x2F0B8, c, main/misc21]
      - [0x33398, c, main/misc22]
      - [0x35E24, c, main/misc23]
      - [0x3AA24, c, main/misc24]
      - [0x3F7D4, c, main/misc25]
      - [0x41B9C, c, main/misc26]
      # misc27 is split in three: func_800B5854 is the only function in the unit that
      # is 100% under gcc 2.7.2 and 93.71% under gcc 2.7.2-cdk (try_flags.sh), while the
      # rest of the unit is cdk-only (see gears.toml, XenoBattleTailCdk). Presets are per
      # file, so the psx function gets its own file.
      - [0x44414, c, main/misc27]
      - [0x45D64, c, main/misc27_psx]
      - [0x45E34, c, main/misc27_b]
      - [0x46900, c, main/misc28]
      - [0x478FC, c, main/misc29]
      - [0x4956C, c, main/misc30]
      - [0x4B758, c, main/misc31]
      - [0x4D170, c, main/misc32]
      - [0x4E62C, c, main/misc33]
      - [0x4FA00, c, main/misc34]
      - [0x50D38, c, main/misc35]
      - [0x52558, data]
  - [0x53F80]
