options:
  basename: battle.bin
  target_path: disc/battle.bin
  base_path: ../
  platform: psx
  compiler: PSYQ

  asm_path: asm/battle
  src_path: src/battle
  build_path: build/

  ld_script_path: linker/battle.ld

  find_file_boundaries: False
  gp_value: 0x80059170
  global_vram_start: 0x80010000

  o_as_suffix: False
  use_legacy_include_asm: False

  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel

  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_addrs_path:
    - config/symbol_addrs.battle.txt
    - config/symbol_addrs.slus_006.64.txt
  reloc_addrs_path:
    - config/reloc_addrs.txt

  undefined_funcs_auto_path: linker/undefined_funcs_auto.battle.txt
  undefined_syms_auto_path: linker/undefined_syms_auto.battle.txt

  extensions_path: tools/splat_ext

  subalign: 4

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  ld_bss_is_noload: true
