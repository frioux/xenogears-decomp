name: Battling Overlay
sha1: 9cfebaf201a0dfd352c11007a63ad7a955533b17
options:
  basename: battling.bin
  target_path: disc/battling.bin
  base_path: ../
  platform: psx
  compiler: PSYQ

  asm_path: asm/battling
  src_path: src/battling
  build_path: build/

  ld_script_path: linker/battling.ld

  find_file_boundaries: False
  gp_value: 0x80059170
  global_vram_start: 0x80010000

  o_as_suffix: False
  use_legacy_include_asm: False

  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel

  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_addrs_path:
    - config/symbol_addrs.battling.txt
    - config/symbol_addrs.slus_006.64.txt
  reloc_addrs_path:
    - config/reloc_addrs.txt

  undefined_funcs_auto_path: linker/undefined_funcs_auto.battling.txt
  undefined_syms_auto_path: linker/undefined_syms_auto.battling.txt

  extensions_path: tools/splat_ext

  subalign: 4

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  ld_bss_is_noload: true
segments:
  - name: battling
    type: code
    start: 0x0
    vram: 0x8006faf0
    bss_size: 0x20000 # yolo
    align: 4
    subalign: 4
    subsegments:
      # The whole overlay is one `asm` segment for now: spimdisasm's full-disasm
      # pass finds every function in it (glabel boundaries) and the bytes
      # reassemble verbatim, so the overlay links byte-identically. Split ranges
      # out into `c` units as they get worked (see AGENTS.md section 9 and
      # reports/TRACKER.md session 4).
      - [0x0, rodata]
      - [0xCB8, c, main/misc1]
      - [0x3228, c, main/misc2]
      - [0x5C48, c, main/misc3]
      - [0x8E30, c, main/misc4]
      - [0xB780, c, main/misc5]
      - [0xE530, c, main/misc6]
      - [0xFD64, c, main/misc7]
      - [0x10E04, c, main/misc8]
      - [0x12688, c, main/misc9]
      - [0x14F74, c, main/misc10]
      - [0x17578, c, main/misc11]
      - [0x18E50, c, main/misc12]
      - [0x1A26C, c, main/misc13]
      - [0x1AB28, c, main/misc14]
      - [0x1C114, c, main/misc15]
      - [0x1D3E4, c, main/misc16]
      - [0x1E630, c, main/misc17]
      - [0x1FA40, c, main/misc18]
      - [0x21448, asm]
      - [0x21654, data]
  - [0x22E68, databin]
  - [0x22E69]
