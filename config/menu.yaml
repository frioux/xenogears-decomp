name: Menu Overlay
sha1: fd911d26b921d6eb0c73c3bbc83ea82dc459122f
options:
  basename: menu.bin
  target_path: disc/menu.bin
  base_path: ../
  platform: psx
  compiler: PSYQ

  asm_path: asm/menu
  src_path: src/menu
  build_path: build/

  ld_script_path: linker/menu.ld

  find_file_boundaries: False
  gp_value: 0x80059170
  global_vram_start: 0x80010000

  o_as_suffix: False
  use_legacy_include_asm: False

  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel

  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_addrs_path:
    - config/symbol_addrs.menu.txt
    - config/symbol_addrs.slus_006.64.txt
  reloc_addrs_path:
    - config/reloc_addrs.txt

  undefined_funcs_auto_path: linker/undefined_funcs_auto.menu.txt
  undefined_syms_auto_path: linker/undefined_syms_auto.menu.txt

  extensions_path: tools/splat_ext

  subalign: 4

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  ld_bss_is_noload: true
segments:
  - name: menu
    type: code
    start: 0x0
    vram: 0x801C5000
    bss_size: 0x20000 # yolo
    align: 4
    subalign: 4
    subsegments:
      # Head of the overlay, by hand (round 450): table A for func_801C531C, then the
      # two BASLUS serial strings, then table B for func_801C72BC, then "bu00:",
      # "bu10:" and "__tmp_file". The two tables are separated by data, so each gets
      # its own unit's .rodata and the strings stay anonymous.
      - [0x0, .rodata, main/misc1]
      - [0x28, rodata]
      - [0x48, .rodata, main/misc1_a]
      - [0xA8, rodata]
      - [0xC8, .rodata, main/misc3]
      - [0xE0, rodata]
      - [0xFC, .rodata, main/misc9]
      - [0x18C, .rodata, main/misc10]
      # The four zero bytes after main/misc10's last jump table: retail's jtbl_801C522C
      # carries a trailing zero word that the seven-case `switch` in func_801E3ECC
      # does not emit, so the unit's .rodata needs this carve to tile to 0x24C.
      - [0x248, rodata]
      - [0x24C, .rodata, main/misc11]
      - [0x278, .rodata, main/misc12]
      - [0x294, rodata]
      - [0x31C, c, main/misc1]
      - [0x22BC, c, main/misc1_a] # func_801C72BC: its jump table sits after the serial strings
      - [0x2B0C, c, main/misc2]
      - [0x3D78, c, main/misc3]
      # menu/main/misc4 is function-mixed: MenuUpdateSubMenuChoice (the head) is
      # 98.13 under gcc 2.6.0 and 100.00 under the Default preset; every other
      # function in the unit is 100.00 under 2.6.0 and func_801CE540 is 97.78
      # under Default (its loop increment is only in retail's beqz delay slot
      # under 2.6.0). One c range per name, so the 2.6.0 run is its own unit.
      - [0x82AC, c, main/misc4]
      - [0x881C, c, main/misc4_260]
      - [0xB9F0, c, main/misc5]
      - [0xCCA0, c, main/misc6]
      - [0xEC4C, c, main/misc7]
      - [0x10A50, c, main/misc7_r1]
      - [0x10BA4, c, main/misc7_r2]
      - [0x12CFC, c, main/misc8]
      - [0x14C84, c, main/misc8_r1]
      - [0x14E3C, c, main/misc8_r2]
      - [0x16920, c, main/misc9]
      - [0x1BF78, c, main/misc10]
      - [0x1F33C, c, main/misc11]
      - [0x1F928, c, main/misc11_r1]
      # A unit name may appear in only ONE c range: splat writes one asm/<unit>.s
      # and the linker script names one .c.o(.text), so a second range with the same
      # name keeps only its own bytes (the middle run was built by gcc 2.6.0, the
      # head and the tail by 2.7.2).
      - [0x1FA28, c, main/misc11_r2]
      # func_801E56E8 .. func_801E68AC were built by gcc 2.6.0; the head and tail
      # of the unit are 2.7.2 (MenuFillInventoryTables is 93.06 under 2.6.0,
      # MenuDrawSlotResourceSprites 99.39).
      - [0x206E8, c, main/misc11_r2_260]
      - [0x21B70, c, main/misc11_r2_b]
      - [0x21CFC, c, main/misc12]
      - [0x246A4, data]
  - [0x25908]
