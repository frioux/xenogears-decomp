name: Menu Overlay
sha1: fd911d26b921d6eb0c73c3bbc83ea82dc459122f
options:
  basename: menu.bin
  target_path: disc/menu.bin
  base_path: ../
  platform: psx
  compiler: PSYQ

  asm_path: asm/menu
  src_path: src/menu
  build_path: build/

  ld_script_path: linker/menu.ld

  find_file_boundaries: False
  gp_value: 0x80059170
  global_vram_start: 0x80010000

  o_as_suffix: False
  use_legacy_include_asm: False

  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel

  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_addrs_path:
    - config/symbol_addrs.menu.txt
    - config/symbol_addrs.slus_006.64.txt
  reloc_addrs_path:
    - config/reloc_addrs.txt

  undefined_funcs_auto_path: linker/undefined_funcs_auto.menu.txt
  undefined_syms_auto_path: linker/undefined_syms_auto.menu.txt

  extensions_path: tools/splat_ext

  subalign: 4

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  ld_bss_is_noload: true
segments:
  - name: menu
    type: code
    start: 0x0
    vram: 0x801C5000
    bss_size: 0x20000 # yolo
    align: 4
    subalign: 4
    subsegments:
      - [0x0, rodata]
      - [0x31C, c, main/misc1]
      - [0x2B0C, c, main/misc2]
      - [0x3D78, c, main/misc3]
      - [0x82AC, c, main/misc4]
      - [0xB9F0, c, main/misc5]
      - [0xCCA0, c, main/misc6]
      - [0xEC4C, c, main/misc7]
      - [0x12CFC, c, main/misc8]
      - [0x14C84, c, main/misc8_r1]
      - [0x14E3C, c, main/misc8_r2]
      - [0x16920, c, main/misc9]
      - [0x1BF78, c, main/misc10]
      - [0x1F33C, c, main/misc11]
      - [0x1F928, c, main/misc11_r1]
      - [0x1FA28, c, main/misc11_r2]
      - [0x21CFC, c, main/misc12]
      - [0x246A4, data]
  - [0x25908]
