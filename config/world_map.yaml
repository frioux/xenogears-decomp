name: World Map Overlay
sha1: 5fee1deab3558c23bbe9c3a2eda3a2021a570911
options:
  basename: world_map.bin
  target_path: disc/world_map.bin
  base_path: ../
  platform: psx
  compiler: PSYQ

  asm_path: asm/world_map
  src_path: src/world_map
  build_path: build/

  ld_script_path: linker/world_map.ld

  find_file_boundaries: False
  gp_value: 0x80059170
  global_vram_start: 0x80010000

  o_as_suffix: False
  use_legacy_include_asm: False

  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel

  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_addrs_path:
    - config/symbol_addrs.world_map.txt
    - config/symbol_addrs.slus_006.64.txt
  reloc_addrs_path:
    - config/reloc_addrs.txt

  undefined_funcs_auto_path: linker/undefined_funcs_auto.world_map.txt
  undefined_syms_auto_path: linker/undefined_syms_auto.world_map.txt

  extensions_path: tools/splat_ext

  subalign: 4

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  ld_bss_is_noload: true
segments:
  - name: world_map
    type: code
    start: 0x0
    vram: 0x8006faf0
    bss_size: 0x20000 # yolo
    align: 4
    subalign: 4
    subsegments:
      - [0x0, rodata]
      - [0x4, .rodata, main/misc1]
      - [0x50, .rodata, main/misc4]
      - [0xD4, .rodata, main/misc5]
      - [0x29C, .rodata, main/misc6]
      - [0x6F0, .rodata, main/misc6_b]
      - [0x7F4, .rodata, main/misc7]
      - [0x98C, .rodata, main/misc8]
      - [0x9D8, .rodata, main/misc8_b]
      - [0x9EC, rodata]
      - [0x9F0, .rodata, main/misc10]
      - [0xA28, .rodata, main/misc11]
      # Round 451: the four stub tables of the misc11 tail tile [0xCBC, 0xDE0); that
      # range's start parity (4 mod 8) is what puts jtbl_800707AC at internal +0.
      - [0xCBC, .rodata, main/misc11_c]
      - [0xDE0, rodata]
      - [0xDE4, .rodata, main/misc11_b]
      # Round 532: misc12.c.o tiles to exactly 0x15C from 0xF08; the five tail tables
      # need a 4-mod-8 range start, so the file splits at 0x1064 (the A84 park's offset).
      - [0xF08, .rodata, main/misc12]
      - [0x1064, .rodata, main/misc12_b]
      - [0x1160, .rodata, main/misc14]
      - [0x11B0, .rodata, main/misc15]
      - [0x120C, rodata]
      - [0x17E0, c, main/misc1]
      - [0x4C5C, c, main/misc2]
      - [0x6F2C, c, main/misc3]
      - [0x81D0, c, main/misc4]
      - [0xAF08, c, main/misc5]
      - [0xD924, c, main/misc6]
      - [0x10880, c, main/misc6_b]
      - [0x10E10, c, main/misc7]
      - [0x13474, c, main/misc8]
      - [0x14578, c, main/misc8_b]
      - [0x16468, c, main/misc9]
      - [0x19050, c, main/misc10]
      - [0x1AC3C, c, main/misc11]
