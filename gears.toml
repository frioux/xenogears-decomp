[directories]
config = 'config'
linker = 'linker'
code = 'src'
assembly = 'asm'
build = 'build'

[compilation]
binary = "slus_006.64"
overlays = ["field", "battling", "movie", "member_change_menu", "shop_menu", "gear_shop_menu", "lib_gear"]
target = 'mips-linux-gnu'

[[build_preset]]
name = "Default"
# Every other preset will inhert the build variables from Default unless they override it
build_variables = {
    gcc = "gcc-2.7.2-psx",
    cc_flags = "-mips1 -mcpu=3000 -w -funsigned-char -fpeephole -ffunction-cse -fpcc-struct-return -fcommon -fverbose-asm -msoft-float -mgas -fgnu-linker -quiet",
    cpp_flags = "-D_LANGUAGE_C -DUSE_INCLUDE_ASM -P -MMD -MP -undef -Wall -lang-c -nostdinc",
    ld_flags = "-nostdlib --no-check-sections",
    maspsx_flags = "--use-comm-section --run-assembler",
    optimization_flag = "-O2",
    gp_flag = "-G8",
    endianness = "-EL"
}

[[build_preset]]
name = "PSY-Q"
build_variables = {
    maspsx_flags = "--aspsx-version=2.56 --expand-div --use-comm-section --run-assembler",
    optimization_flag = "-O3",
    gp_flag = "-G0"
}
paths = [ "{binary}/psyq" ]

# system/sound is 2.6.0 for its WHOLE length: of the 235 functions defined in C,
# 45 are 100% under 2.6.0 and 70-99.6% under 2.7.2 (they are spread over the whole
# range, 0x37E8C..0x3F5EC), while ZERO functions are 2.7.2-only. func_8003D53C is
# the one function whose C is 100% under 2.7.2 and 95.83% under 2.6.0, and its
# neighbours are 2.6.0-only, so the unit cannot be carved at a compiler boundary.
[[build_preset]]
name = "XenoLibrary"
build_variables = {
    gcc = "gcc-2.6.0-psx"
}
paths = [
    "{binary}/system/libarchive.",
    "{binary}/system/sound.",
    "member_change_menu/main/misc.",
    "shop_menu/main/misc.",
    "lib_gear/main/main.",
    "gear_shop_menu/main/main.",
    "gear_shop_menu/main/render."
]

[[build_preset]]
name = "XenoGraphics"
build_variables = {
    gcc = "gcc-2.7.2-cdk-psx",
    maspsx_flags = "--aspsx-version=2.67 --use-comm-section --run-assembler"
}
paths = [
    "{binary}/system/animation_scripts.",
    "{binary}/system/temp1.",
    "{binary}/system/temp2."
]

[[build_preset]]
name = "XenoMain"
build_variables = {
    gp_flag = "-G0"
}
paths = [ "{binary}/main/main_loop." ]

[[build_preset]]
name = "XenoGraphicsLibrary"
build_variables = {
    gcc = "gcc-2.6.0-psx",
    maspsx_flags = "--expand-div --use-comm-section --run-assembler",
}
paths = [
    "{binary}/graphics/line_scroll.",
]

# lib_gear/main/main was built with div expansion (the original object is full of
# 'break' sequences around its divisions). Must stay after XenoLibrary: presets
# later in the file overwrite an earlier preset that lists the same path.
[[build_preset]]
name = "XenoLibraryDiv"
build_variables = {
    gcc = "gcc-2.6.0-psx",
    maspsx_flags = "--expand-div --use-comm-section --run-assembler"
}
paths = [ "lib_gear/main/main." ]

# system/rendering's original object expands small positive `li` constants with
# addiu, not maspsx's ori, so let the assembler do the expansion.
[[build_preset]]
name = "XenoRendering"
build_variables = {
    maspsx_flags = "--dont-expand-li --use-comm-section --run-assembler"
}
paths = [ "{binary}/system/rendering." ]

# The tail of system/rendering (GraphicsDrawPauseLetters, func_8001FB30) came from
# a TU built with the cdk compiler: the same C is byte-identical under
# gcc-2.7.2-cdk-psx and stops at 98.81% under 2.7.2-psx, while the rest of the
# unit does the opposite. Kept as a separate path so the two presets can differ.
[[build_preset]]
name = "XenoPauseText"
build_variables = {
    gcc = "gcc-2.7.2-cdk-psx",
    maspsx_flags = "--aspsx-version=2.67 --use-comm-section --run-assembler"
}
paths = [ "{binary}/system/rendering_pause_text." ]
