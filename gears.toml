[directories]
config = 'config'
linker = 'linker'
code = 'src'
assembly = 'asm'
build = 'build'

[compilation]
binary = "slus_006.64"
overlays = ["field", "battling", "world_map", "battle", "menu", "movie", "member_change_menu", "shop_menu", "gear_shop_menu", "lib_gear"]
target = 'mips-linux-gnu'

[[build_preset]]
name = "Default"
# Every other preset will inhert the build variables from Default unless they override it
build_variables = {
    gcc = "gcc-2.7.2-psx",
    cc_flags = "-mips1 -mcpu=3000 -w -funsigned-char -fpeephole -ffunction-cse -fpcc-struct-return -fcommon -fverbose-asm -msoft-float -mgas -fgnu-linker -quiet",
    cpp_flags = "-D_LANGUAGE_C -DUSE_INCLUDE_ASM -P -MMD -MP -undef -Wall -lang-c -nostdinc",
    ld_flags = "-nostdlib --no-check-sections",
    maspsx_flags = "--use-comm-section --run-assembler",
    optimization_flag = "-O2",
    gp_flag = "-G8",
    endianness = "-EL"
}

[[build_preset]]
name = "PSY-Q"
build_variables = {
    maspsx_flags = "--aspsx-version=2.56 --expand-div --use-comm-section --run-assembler",
    optimization_flag = "-O3",
    gp_flag = "-G0"
}
paths = [ "{binary}/psyq" ]

# system/sound is 2.6.0 for its WHOLE length: of the 235 functions defined in C,
# 45 are 100% under 2.6.0 and 70-99.6% under 2.7.2 (they are spread over the whole
# range, 0x37E8C..0x3F5EC), while ZERO functions are 2.7.2-only. func_8003D53C is
# the one function whose C is 100% under 2.7.2 and 95.83% under 2.6.0, and its
# neighbours are 2.6.0-only, so the unit cannot be carved at a compiler boundary.
[[build_preset]]
name = "XenoLibrary"
build_variables = {
    gcc = "gcc-2.6.0-psx"
}
paths = [
    "{binary}/system/libarchive.",
    "{binary}/system/sound.",
    "member_change_menu/main/misc.",
    "shop_menu/main/misc.",
    "lib_gear/main/main.",
    "gear_shop_menu/main/main.",
    "gear_shop_menu/main/render."
]

[[build_preset]]
name = "XenoGraphics"
build_variables = {
    gcc = "gcc-2.7.2-cdk-psx",
    maspsx_flags = "--aspsx-version=2.67 --use-comm-section --run-assembler"
}
paths = [
    "{binary}/system/animation_scripts.",
    "{binary}/system/temp1.",
    "{binary}/system/temp2."
]

[[build_preset]]
name = "XenoMain"
build_variables = {
    gp_flag = "-G0"
}
paths = [ "{binary}/main/main_loop." ]

[[build_preset]]
name = "XenoGraphicsLibrary"
build_variables = {
    gcc = "gcc-2.6.0-psx",
    maspsx_flags = "--expand-div --use-comm-section --run-assembler",
}
paths = [
    "{binary}/graphics/line_scroll.",
]

# lib_gear/main/main was built with div expansion (the original object is full of
# 'break' sequences around its divisions). Must stay after XenoLibrary: presets
# later in the file overwrite an earlier preset that lists the same path.
[[build_preset]]
name = "XenoLibraryDiv"
build_variables = {
    gcc = "gcc-2.6.0-psx",
    maspsx_flags = "--expand-div --use-comm-section --run-assembler"
}
paths = [ "lib_gear/main/main." ]

# system/rendering's original object expands small positive `li` constants with
# addiu, not maspsx's ori, so let the assembler do the expansion.
[[build_preset]]
name = "XenoRendering"
build_variables = {
    maspsx_flags = "--dont-expand-li --use-comm-section --run-assembler"
}
paths = [ "{binary}/system/rendering." ]

# The tail of system/rendering (GraphicsDrawPauseLetters, func_8001FB30) came from
# a TU built with the cdk compiler: the same C is byte-identical under
# gcc-2.7.2-cdk-psx and stops at 98.81% under 2.7.2-psx, while the rest of the
# unit does the opposite. Kept as a separate path so the two presets can differ.
[[build_preset]]
name = "XenoPauseText"
build_variables = {
    gcc = "gcc-2.7.2-cdk-psx",
    maspsx_flags = "--aspsx-version=2.67 --use-comm-section --run-assembler"
}
paths = [ "{binary}/system/rendering_pause_text." ]

# world_map's original object is addiu-dominant (2483 `addiu $r,$zero,imm` vs 23
# `ori`), so ASPSX >= 2.50 left `li` to the assembler: maspsx must not expand it.
#
# EVERY unit is listed by name, never as a `world_map/` directory key: gears
# resolves presets by iterating a HashMap of path keys and taking the first key
# that the unit path contains, so a directory key plus a per-file key makes the
# choice depend on HashMap order, i.e. random per `gears` run. That is how
# world_map/main/misc13 silently lost `--expand-div` and broke the overlay.
[[build_preset]]
name = "XenoWorldMap"
build_variables = {
    maspsx_flags = "--dont-expand-li --use-comm-section --run-assembler"
}
paths = [
    "world_map/main/misc1.",
    "world_map/main/misc3.",
    "world_map/main/misc4.",
    "world_map/main/misc9.",
    "world_map/main/misc11.",
    "world_map/main/misc12.",
    "world_map/main/misc15."
]

# battle/main/misc26..misc35 are addiu-dominant (`addiu $r,$zero,imm` counts
# 17-117 vs 0-12 `ori`), while misc1..misc25 are the opposite (0 addiu, 43-153
# ori). So one emitter boundary sits inside the overlay at function 625: the
# tail was assembled by ASPSX >= 2.50, which leaves `li` to the assembler, and
# maspsx must not expand it there. Same class as XenoWorldMap/XenoRendering.
[[build_preset]]
name = "XenoBattleTail"
build_variables = {
    maspsx_flags = "--dont-expand-li --use-comm-section --run-assembler"
}
paths = [
    "battle/main/misc26.",
    "battle/main/misc27_psx.",
    "battle/main/misc28.",
    "battle/main/misc29.",
    "battle/main/misc30.",
    "battle/main/misc31.",
    "battle/main/misc32.",
    "battle/main/misc33.",
    "battle/main/misc34.",
    "battle/main/misc35."
]

# battling/main/misc12 is a -G0 unit, proven the way section 5 asks for:
# func_80088940 is 100.0% under -G0 and 44.86% under Default -G8, and all six
# functions in the unit that were already matched stay at 100.0 under -G0. The
# symptom that identifies the family: the original holds &D_<addr> in a saved
# register across a call, which -G2..-G8 makes pointless (gp-relative reload is
# one instruction) and -G0 forces. misc7 has the same symptom at weaker evidence
# (63.5 -> 96.08), so the rest of `battling` is a per-unit -G0 question.
[[build_preset]]
name = "XenoBattlingNoGp"
build_variables = {
    gp_flag = "-G0"
}
paths = [ "battling/main/misc12." ]

# battle/main/misc22's retail object carries the ASPSX div trap (`break 7`/`break 6`),
# so maspsx has to expand `div`. Proven on func_800A3578: byte-exact C is 55.00% under
# Default and 100% with --expand-div, the only difference being the trap sequence.
[[build_preset]]
name = "XenoBattleDiv"
build_variables = {
    maspsx_flags = "--expand-div --use-comm-section --run-assembler"
}
paths = [ "battle/main/misc22." ]

# The rest of the div-trap family (same evidence as XenoBattleDiv above; 50 stubs
# across 20 units carry `break 6`/`break 7` in their own .s, and a unit's preset
# has to expand `div` for any of them to match at all).
[[build_preset]]
name = "XenoBattleDiv"
build_variables = {
    maspsx_flags = "--expand-div --use-comm-section --run-assembler"
}
paths = [
    "battle/main/misc21.",
    "battle/main/misc23.",
    "battle/main/misc24.",
    "battle/main/misc25.",
    "battling/main/misc15.",
    "movie/main/misc1.",
    "movie/main/misc2."
]

# world_map is addiu-dominant AND expands div: both flags, not either.
[[build_preset]]
name = "XenoWorldMapDiv"
build_variables = {
    maspsx_flags = "--dont-expand-li --expand-div --use-comm-section --run-assembler"
}
paths = [
    "world_map/main/misc2.",
    "world_map/main/misc5.",
    "world_map/main/misc6.",
    "world_map/main/misc7.",
    "world_map/main/misc8.",
    "world_map/main/misc10.",
    "world_map/main/misc13.",
    "world_map/main/misc14.",
    "world_map/main/misc16."
]

[[build_preset]]
name = "XenoGraphicsDiv"
build_variables = {
    gcc = "gcc-2.7.2-cdk-psx",
    maspsx_flags = "--aspsx-version=2.67 --expand-div --use-comm-section --run-assembler"
}
paths = [ "slus_006.64/system/temp2." ]

# battle/main/misc20 is a gcc-2.6.0 unit, proven the way section 5 asks for:
# func_8009E410 is 100.0% under gcc-2.6.0 -O2 -G8 and 99.68% under Default, and the
# already-matched func_8009CB68 / func_8009E3C8 stay at 100.0 under 2.6.0. Five more
# stubs in the unit sit on the identical one-register mfhi/mflo miss, which is the
# same signature as the other 2.6.0 misc units.
[[build_preset]]
name = "XenoBattle260"
build_variables = {
    gcc = "gcc-2.6.0-psx"
}
# battle/main/misc18 is the same unit family (round 12): func_80096824 is 100.0 under
# 2.6.0 vs 99.74 under Default, func_80095BAC 100.0 vs 99.90, func_80098C6C 100.0 vs
# 95.83, and all six already-matched functions stay at 100.0.
# battle/main/misc1 joined in round 18: under 2.6.0 EVERY function matched in it scores
# 100.0 (and so do its two parked bodies, func_800716D8 78.82->100.0 and
# func_800718BC 94.76->100.0), while under 2.7.2 both of those are stuck below 95%.
# func_80071A38 and func_80071A08 were the two blockers at 99.05/99.17 and both closed
# once the address was written base-first (`pDst = D_x; *(pDst + i + K)`), so the unit
# is flippable with nothing lost.
paths = [ "battle/main/misc20.", "battle/main/misc18.", "battle/main/misc1." ]

# battle/main/misc21 is a gcc-2.6.0 unit AND a div-expansion unit, proven the way
# section 5 asks for: func_800A23E8 is 100.0% under gcc-2.6.0 and 80.53% under
# XenoBattleDiv (2.7.2), where its C is 0x48 bytes against retail's 0x4c; the ten
# functions already matched in the unit stay at 100.0 under 2.6.0. Three stubs in
# the unit also carry the ASPSX div trap (`break 6`/`break 7`), so it needs both.
# Must stay after XenoBattleDiv, which lists the same path.
[[build_preset]]
name = "XenoBattle260Div"
build_variables = {
    gcc = "gcc-2.6.0-psx",
    maspsx_flags = "--expand-div --use-comm-section --run-assembler"
}
paths = [ "battle/main/misc21." ]

# menu/main/misc9 is a gcc-2.6.0 unit, proven the way section 5 asks for:
# func_801DE29C is 100.0% under 2.6.0 and 67.27% under Default (2.7.2 sinks the
# epilogue's `li v0,1` past `lw ra`), func_801DBDB4 is 94.47% vs 86.97%, and all
# three functions already matched in the unit stay at 100.0 under 2.6.0. It does
# NOT fix the unit's other blocker (a 3-case switch that retail lowers as a
# binary-search tree and every gcc we have lowers sequentially), so treat that
# family as parked.

# menu/main/misc5 is a gcc-2.6.0 unit, proven the way section 5 asks for: all NINETEEN
# already-matched functions stay at 100.0 under 2.6.0, and func_801D1258 is 100.00% only
# there (99.35 under Default, the sole difference being a canonicalised commutative
# addu). Its parked body is a straight uncomment once the preset is on.
[[build_preset]]
name = "XenoMenu260"
build_variables = {
    gcc = "gcc-2.6.0-psx"
}
# menu/main/misc6 and misc10 joined the same family in round 15: for misc6 all 15
# already-matched functions stay 100.0 under 2.6.0 and func_801D249C is 100.0 only there
# (99.88 under 2.7.2); for misc10 five sampled matched functions stay 100.0 and
# func_801E42AC is 100.0 under 2.6.0 vs 89.56 under 2.7.2. Three parked bodies in misc6
# are straight uncomments once the preset is on.
paths = [ "menu/main/misc9.", "menu/main/misc5.", "menu/main/misc6.", "menu/main/misc10." ]

# battle/main/misc27 is function-mixed and cannot be a single-preset unit: its
# callback cluster is byte-identical only under gcc 2.7.2-cdk (the parked bodies in
# src/battle/main/misc27.c are 100.0 there and 65-98% under 2.7.2), while
# func_800B5854 is 100.0 under 2.7.2 and 93.71 under -cdk. config/battle.yaml splits
# the unit into main/misc27 + main/misc27_b (this preset) and main/misc27_psx (the
# 2.7.2 tail of XenoBattleTail). maspsx flags are XenoBattleTail's unchanged.
[[build_preset]]
name = "XenoBattleTailCdk"
build_variables = {
    gcc = "gcc-2.7.2-cdk-psx",
    maspsx_flags = "--dont-expand-li --use-comm-section --run-assembler"
}
paths = [ "battle/main/misc27.", "battle/main/misc27_b." ]
